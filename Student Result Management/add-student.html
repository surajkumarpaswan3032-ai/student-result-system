<!DOCTYPE html>
<html>
<head>
    <title>Add Student Result</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Add Student Result</h1>
    <a href="index.html">⬅ Home</a>
</header>

<div class="form-box">
    <input type="text" id="name" placeholder="Student Name">
    <input type="number" id="roll" placeholder="Roll Number">
    <input type="number" id="m1" placeholder="Math Marks">
    <input type="number" id="m2" placeholder="Science Marks">
    <input type="number" id="m3" placeholder="English Marks">
    <button onclick="addResult()">Save Result</button>
</div>

<script src="script.js"></script>
</body>
</html>
